<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teyei Services | Admin Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        header {
            background: #071b3a;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 22px;
        }

        header span {
            font-size: 14px;
            opacity: 0.8;
        }

        .container {
            width: 95%;
            max-width: 1400px;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .top-bar h2 {
            color: #071b3a;
        }

        button {
            border: none;
            background: #0878f9;
            color: white;
            padding: 11px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0564d4;
        }

        .table-container {
            background: white;
            border-radius: 10px;
            overflow-x: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e5e9f0;
        }

        th {
            background: #071b3a;
            color: white;
            font-size: 13px;
        }

        td {
            font-size: 14px;
        }

        tr:hover {
            background: #f7faff;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            background: #fff4cc;
            color: #856404;
            font-size: 12px;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #777;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .error {
            text-align: center;
            padding: 30px;
            color: #b42318;
        }

        @media (max-width: 700px) {

            header {
                padding: 18px;
            }

            .container {
                width: 92%;
            }

            .top-bar {
                align-items: flex-start;
                flex-direction: column;
            }

        }

        /* SEARCH BOX */

.search-box {
    width: 100%;
    margin: 20px 0;
}

.search-box input {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #d6dce5;
    border-radius: 8px;
    font-size: 15px;
    background: #ffffff;
    color: #1f2937;
    outline: none;
    transition: 0.2s ease;
}

.search-box input:focus {
    border-color: #0878f9;
    box-shadow: 0 0 0 3px rgba(8, 120, 249, 0.12);
}

.search-box input::placeholder {
    color: #8a94a6;
}

.stats-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 25px;
}

.stat-card {
    background: white;
    padding: 22px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
}

.stat-card h3 {
    color: #667085;
    font-size: 14px;
    margin-bottom: 10px;
}

.stat-card p {
    color: #071b3a;
    font-size: 30px;
    font-weight: bold;
}

@media (max-width: 700px) {

    .stats-container {
        grid-template-columns: 1fr;
    }

}
    </style>
</head>

<body>

    <header>

    <h1>Teyei Services</h1>

    <span>Admin Dashboard</span>

    <button onclick="logoutAdmin()">
        🚪 Logout
    </button>

</header>

    <main class="container">

        <div class="stats-container">

    <div class="stat-card">
        <h3>Total Requests</h3>
        <p id="totalRequests">0</p>
    </div>

    <div class="stat-card">
        <h3>Pending</h3>
        <p id="pendingRequests">0</p>
    </div>

    <div class="stat-card">
        <h3>Completed</h3>
        <p id="completedRequests">0</p>
    </div>

</div>

        <div class="top-bar">

            <h2>Service Requests</h2>

            <button onclick="loadRequests()">
                🔄 Refresh
            </button>

        </div>

        <div class="search-box">

            <input
            type="text"
            id="searchRequests"
            placeholder="Search by name, phone or service..."
            >
        </div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Customer</th>
                        <th>Phone</th>
                        <th>Service</th>
                        <th>Location</th>
                        <th>Date</th>
                        <th>Message</th>
                        <th>Status</th>
                    </tr>

                </thead>

                <tbody id="requestsTable">

                    <tr>
                        <td colspan="8" class="loading">
                            Loading requests...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </main>


    <script>

    const isLoggedIn =
        sessionStorage.getItem("teyieAdminLoggedIn");

    if (isLoggedIn !== "true") {
        window.location.href = "login.html";
    }

    function logoutAdmin() {
        sessionStorage.removeItem("teyieAdminLoggedIn");

        window.location.href = "login.html";
    }

        async function loadRequests() {

            const table =
                document.getElementById("requestsTable");

                

            table.innerHTML = `
                <tr>
                    <td colspan="8" class="loading">
                        Loading requests...
                    </td>
                </tr>
            `;

            try {

                const response =
                    await fetch(
                        "http://teyie-services.onrender.com/api/service-requests"
                    );

                const data =
                    await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(
                        "Could not load requests."
                    );
                }

                const total =
    data.requests.length;

const pending =
    data.requests.filter(
        request => request.status === "Pending"
    ).length;

const completed =
    data.requests.filter(
        request => request.status === "Completed"
    ).length;

document.getElementById("totalRequests").textContent =
    total;

document.getElementById("pendingRequests").textContent =
    pending;

document.getElementById("completedRequests").textContent =
    completed;

                if (!data.requests.length) {

                    table.innerHTML = `
                        <tr>
                            <td colspan="8" class="empty">
                                No service requests yet.
                            </td>
                        </tr>
                    `;

                    return;
                }

                table.innerHTML = "";

                data.requests.forEach(function (request) {

                    const row =
                        document.createElement("tr");

                    row.innerHTML = `

                        <td>${request.id}</td>

                        <td>${request.name || "-"}</td>

                        <td>${request.phone || "-"}</td>

                        <td>${request.service || "-"}</td>

                        <td>${request.location || "-"}</td>

                        <td>${request.date || "-"}</td>

                        <td>${request.message || "-"}</td>

                        <td>
                 <td>
    <span class="status ${request.status === "Completed" ? "Completed" : "pendind"}">
        ${request.status || "Pending"}
    </span>

    <br><br>

    <button onclick="markCompleted(${request.id})">
        Mark Completed
    </button>

    <br><br>

    <button onclick="deleteRequest(${request.id})">
        🗑️ Delete
    </button>
</td>

                    `;

                    table.appendChild(row);

                });

            } catch (error) {

                console.error(error);

                table.innerHTML = `
                    <tr>
                        <td colspan="8" class="error">
                            Could not connect to the Teyei Services API.
                            <br><br>
                            Make sure the backend is running.
                        </td>
                    </tr>
                `;

            }

        }


        loadRequests();

        setInterval(() => {
            loadRequests();
            }, 30000);
    
    async function markCompleted(id) {

    try {

        const response = await fetch(
            `http://localhost:5000/api/service-requests/${id}/status`,
            {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    status: "Completed"
                })
            }
        );

        const result = await response.json();

        if (!response.ok) {
            throw new Error(
                result.message || "Could not update request."
            );
        }

        alert("Request marked as completed.");

        loadRequests();

    } catch (error) {

        console.error(error);

        alert(
            "Could not update the request. " +
            "Make sure the backend is running."
        );

    }

}

async function deleteRequest(id) {

    const confirmed = confirm(
        "Are you sure you want to delete this service request?"
    );

    if (!confirmed) {
        return;
    }

    try {

        const response = await fetch(
            `http://localhost:5000/api/service-requests/${id}`,
            {
                method: "DELETE"
            }
        );

        const result = await response.json();

        if (!response.ok) {
            throw new Error(
                result.message || "Could not delete request."
            );
        }

        alert("Service request deleted.");

        loadRequests();

    } catch (error) {

        console.error(error);

        alert(
            "Could not delete the request. " +
            "Make sure the backend is running."
        );

    }

}

const searchInput =
    document.getElementById("searchRequests");

if (searchInput) {

    searchInput.addEventListener(
        "input",
        function () {

            const searchTerm =
                this.value.toLowerCase().trim();

            const rows =
                document.querySelectorAll(
                    "#requestsTable tr"
                );

            rows.forEach(function (row) {

                const rowText =
                    row.textContent.toLowerCase();

                if (
                    searchTerm === "" ||
                    rowText.includes(searchTerm)
                ) {
                    row.style.display = "";
                } else {
                    row.style.display = "none";
                }

            });

        }
    );

}
</script>



</body>

</html>
