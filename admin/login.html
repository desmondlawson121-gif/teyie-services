<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teyei Services | Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #071b3a;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0878f9;
            color: white;
            border-radius: 12px;
            font-size: 24px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #071b3a;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #172033;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5dce8;
            border-radius: 7px;
            margin-bottom: 18px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #0878f9;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #0878f9;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0564d4;
        }

        #loginMessage {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <div class="logo">
            TS
        </div>

        <h1>Admin Login</h1>

        <p class="subtitle">
            Teyei Services Management
        </p>

        <form id="loginForm">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div id="loginMessage"></div>

    </div>


    <script>

     

    const loginForm =
        document.getElementById("loginForm");

    loginForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            const loginMessage =
                document.getElementById("loginMessage");

            try {

                const response = await fetch(
                    "http://localhost:5000/api/admin/login",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.message || "Login failed."
                    );
                }

                sessionStorage.setItem(
                    "teyieAdminLoggedIn",
                    "true"
                );

                window.location.href =
                    "admin.html";

            } catch (error) {

                console.error(error);

                loginMessage.textContent =
                    "Invalid username or password.";

                loginMessage.style.color =
                    "#b42318";
            }

        })

    </script>

</body>

</html>
